name: profitnet
description: "ProfitNet - marketplace for second-hand items (Flutter client)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.11.1
  cupertino_ui: ^1.1.7
  crypto: ^3.0.8
  dio: ^5.11.1
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  geolocator: ^14.1.2
  go_router: ^18.1.4
  intl: ^0.20.3
  json_annotation: ^4.12.0
  riverpod_annotation: ^4.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: ^2.17.1
  drift_dev: ^2.35.3
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.10

flutter:
  uses-material-design: true
  generate: true

  assets:
    # Reference API responses served by the development-only fake API.
    # Copied from ../api/fixtures by `dart run tool/sync_shared_assets.dart`.
    - assets/fixtures/

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
